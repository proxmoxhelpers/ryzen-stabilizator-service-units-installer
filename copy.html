<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copy paste-to-run.sh</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:720px;margin:4rem auto;padding:0 1rem}button{font:inherit;font-weight:700;padding:.85rem 1.15rem;border:1px solid #666;border-radius:.55rem;background:#111;color:#fff;cursor:pointer}button:disabled{opacity:.6;cursor:default}#status{margin-top:1rem;color:#444}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
</style>
</head>
<body>
<h1>ryzen-stabilizator-service-units-installer</h1>
<p><button id="copy" type="button">📋 Copy paste-to-run.sh</button></p>
<p id="status">Loads <code>paste-to-run.sh</code> when clicked.</p>
<script>
const button=document.getElementById('copy');
const status=document.getElementById('status');
async function copyText(text){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return;}const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();if(!document.execCommand('copy'))throw new Error('Clipboard access was denied');ta.remove();}
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Loading paste-to-run.sh…';try{const url=new URL('paste-to-run.sh',location.href);url.searchParams.set('cache_bust',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const text=await response.text();await copyText(text);status.textContent=`Copied paste-to-run.sh (${text.length} characters).`;}catch(error){status.textContent=`Copy failed: ${error.message}`;}finally{button.disabled=false;}});
</script>
</body>
</html>
